name: PHP and native source contracts
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.4', '8.5']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl
          coverage: none
      - name: Load the pinned SDK for source tests
        run: git clone --depth 1 --branch v1.6.1 https://github.com/Paymos-labs/php-sdk.git "$RUNNER_TEMP/sdk"
      - name: Module unit and source compilation tests
        env:
          PAYMOS_SDK_SRC: ${{ runner.temp }}/sdk/src
        run: php tests/run.php
      - name: Fetch checksum-pinned upstream core sources
        run: python3 tests/fetch-native-tools.py "$RUNNER_TEMP/prestashop-core"
      - name: Keep existing cron tokens on supported generations
        run: |
          for version in 1.7.8.11 8.2.2 9.0.0 9.2.0; do
            if [ "${{ matrix.php }}" = '7.4' ] && [[ "$version" == 9.* ]]; then continue; fi
            php tests/native-tools.php "$RUNNER_TEMP/prestashop-core" "$version"
          done
